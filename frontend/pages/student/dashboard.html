<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Cursos — CursosLucrativos</title>
    <meta name="description" content="Acesse todos os seus cursos e ebooks exclusivos." />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="../../assets/css/layouts.css" />
</head>

<body>

    <div class="app-layout">

        <!-- ── SIDEBAR ── -->
        <aside class="sidebar" id="sidebar">
            <a href="dashboard.html" class="sidebar-logo">
                <div class="sidebar-logo-icon">📚</div>
                <div class="sidebar-logo-text">
                    CursosLucrativos
                    <div class="sidebar-logo-tagline">Área do Aluno</div>
                </div>
            </a>

            <nav class="sidebar-section">
                <div class="sidebar-section-label">Minha Área</div>
                <a href="dashboard.html" class="nav-link active"><span class="nav-icon">🏠</span> Meus Cursos</a>
                <a href="perfil.html" class="nav-link"><span class="nav-icon">👤</span> Meu Perfil</a>
            </nav>

            <nav class="sidebar-section">
                <div class="sidebar-section-label">Mais cursos</div>
                <a href="../../../catalogo.html" class="nav-link" target="_blank"><span class="nav-icon">📚</span> Ver
                    Catálogo</a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar" id="sidebar-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebar-user-name">Carregando...</div>
                        <div class="sidebar-user-role" id="sidebar-user-role">Aluno</div>
                    </div>
                    <button id="logout-btn" title="Sair"
                        style="background:none;border:none;cursor:pointer;font-size:1rem;padding:4px;color:var(--text-muted);"
                        title="Sair">↩</button>
                </div>
            </div>
        </aside>

        <!-- ── ÁREA PRINCIPAL ── -->
        <div class="main-wrapper">

            <!-- Topbar -->
            <header class="topbar">
                <button id="menu-toggle" class="btn btn-ghost btn-sm" style="display:none;" aria-label="Menu">☰</button>
                <div class="topbar-greeting">
                    <div class="topbar-greeting-text">Bem-vindo,</div>
                    <div class="topbar-greeting-name" id="topbar-greeting-name">Aluno</div>
                </div>
                <div class="topbar-actions">
                    <button id="btn-dark-student" title="Alternar modo escuro" onclick="UI.toggleDark()"
                        style="background:none;border:1.5px solid var(--border-color);border-radius:var(--radius-md);padding:6px 12px;cursor:pointer;font-size:1rem;color:var(--text-secondary);margin-right:8px;transition:all .2s;">
                        🌙
                    </button>
                </div>
            </header>

            <!-- Conteúdo -->
            <main class="main-content">

                <!-- Saudação personalizada -->
                <div class="page-header">
                    <h1 id="greeting-text">Olá! Seus conteúdos estão prontos.</h1>
                    <p>Selecione um curso abaixo para acessar o material completo.</p>
                </div>

                <!-- Contagem de cursos -->
                <div style="margin-bottom: var(--space-6); display: flex; align-items: center; gap: var(--space-3);">
                    <span style="font-size: var(--text-sm); color: var(--text-secondary);">
                        Você tem acesso a
                        <strong id="courses-count" style="color: var(--primary);">...</strong>
                        curso(s)
                    </span>
                </div>

                <!-- Grid de Cursos -->
                <div class="courses-grid" id="courses-grid">
                    <!-- Skeleton Loading -->
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>

            </main>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- Botão flutuante WhatsApp -->
    <div id="wpp-fab" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;">
        <a id="wpp-fab-link" href="#" target="_blank" rel="noopener" aria-label="Falar com o suporte no WhatsApp"
            title="Falar no WhatsApp"
            style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;background:#25D366;border-radius:50%;box-shadow:0 6px 20px rgba(37,211,102,0.45);text-decoration:none;transition:all 0.3s;animation:pulse-wpp 2.5s ease-in-out infinite;">
            <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                <path
                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z" />
                <path
                    d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.659 1.438 5.168L2 22l4.956-1.418A9.96 9.96 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.96 7.96 0 01-4.037-1.1l-.29-.173-2.94.841.854-2.868-.19-.295A7.96 7.96 0 014 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z" />
            </svg>
        </a>
    </div>
    <style>
        @keyframes pulse-wpp {

            0%,
            100% {
                box-shadow: 0 6px 20px rgba(37, 211, 102, .45)
            }

            50% {
                box-shadow: 0 6px 28px rgba(37, 211, 102, .8), 0 0 0 8px rgba(37, 211, 102, .12)
            }
        }

        #wpp-fab a:hover {
            transform: scale(1.1);
            animation: none;
            box-shadow: 0 10px 28px rgba(37, 211, 102, .6);
        }
    </style>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/student-core.js"></script>
    <script>
        UI.restoreDark();
        if (window.innerWidth <= 768) document.getElementById('menu-toggle').style.display = 'inline-flex';
        StudentCore.initDashboard();
        // WhatsApp FAB
        const _wppLink = document.getElementById('wpp-fab-link');
        if (_wppLink && CONFIG.WHATSAPP_NUMBER) {
            const _msg = encodeURIComponent('Olá! Sou aluno da plataforma e tenho uma dúvida.');
            _wppLink.href = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${_msg}`;
        }
    </script>
</body>

</html>
