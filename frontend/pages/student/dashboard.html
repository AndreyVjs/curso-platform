<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Cursos — CursoPlataforma</title>
    <meta name="description" content="Acesse todos os seus cursos e ebooks exclusivos." />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="../../assets/css/layouts.css" />
</head>

<body>

    <div class="app-layout">

        <!-- ── SIDEBAR ── -->
        <aside class="sidebar" id="sidebar">
            <a href="dashboard.html" class="sidebar-logo">
                <div class="sidebar-logo-icon">📚</div>
                <div class="sidebar-logo-text">
                    CursoPlataforma
                    <div class="sidebar-logo-tagline">Área do Aluno</div>
                </div>
            </a>

            <nav class="sidebar-section">
                <div class="sidebar-section-label">Minha Área</div>
                <a href="dashboard.html" class="nav-link active"><span class="nav-icon">🏠</span> Meus Cursos</a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar" id="sidebar-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebar-user-name">Carregando...</div>
                        <div class="sidebar-user-role" id="sidebar-user-role">Aluno</div>
                    </div>
                    <button id="logout-btn" title="Sair"
                        style="background:none;border:none;cursor:pointer;font-size:1rem;padding:4px;color:var(--text-muted);"
                        title="Sair">↩</button>
                </div>
            </div>
        </aside>

        <!-- ── ÁREA PRINCIPAL ── -->
        <div class="main-wrapper">

            <!-- Topbar -->
            <header class="topbar">
                <button id="menu-toggle" class="btn btn-ghost btn-sm" style="display:none;" aria-label="Menu">☰</button>
                <div class="topbar-greeting">
                    <div class="topbar-greeting-text">Bem-vindo,</div>
                    <div class="topbar-greeting-name" id="topbar-greeting-name">Aluno</div>
                </div>
            </header>

            <!-- Conteúdo -->
            <main class="main-content">

                <!-- Saudação personalizada -->
                <div class="page-header">
                    <h1 id="greeting-text">Olá! Seus conteúdos estão prontos.</h1>
                    <p>Selecione um curso abaixo para acessar o material completo.</p>
                </div>

                <!-- Contagem de cursos -->
                <div style="margin-bottom: var(--space-6); display: flex; align-items: center; gap: var(--space-3);">
                    <span style="font-size: var(--text-sm); color: var(--text-secondary);">
                        Você tem acesso a
                        <strong id="courses-count" style="color: var(--primary);">...</strong>
                        curso(s)
                    </span>
                </div>

                <!-- Grid de Cursos -->
                <div class="courses-grid" id="courses-grid">
                    <!-- Skeleton Loading -->
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>

            </main>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/student-core.js"></script>
    <script>
        if (window.innerWidth <= 768) document.getElementById('menu-toggle').style.display = 'inline-flex';
        StudentCore.initDashboard();
    </script>
</body>

</html>
